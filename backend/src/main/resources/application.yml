spring:
  application:
    name: vmart-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vmart}
    username: ${DB_USERNAME:vmart}
    password: ${DB_PASSWORD:change-me}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.boot.flyway: DEBUG
    org.flywaydb: DEBUG