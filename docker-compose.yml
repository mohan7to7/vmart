services:
  postgres:
    image: postgres:17
    container_name: vmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vmart}
      POSTGRES_USER: ${POSTGRES_USER:-vmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vmart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vmart} -d ${POSTGRES_DB:-vmart}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vmart-postgres-data:
